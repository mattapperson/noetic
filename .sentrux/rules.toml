# Sentrux rules for the noetic monorepo.
#
# Encodes the architectural intent from specs/00-overview.md (package
# dependency graph) and specs/22-cli-architecture.md (CLI internal layers).
#
# Sentrux `order` convention (observed empirically from sentrux 0.5.7):
# LOWER order = architecturally HIGHER (consumer, top of stack);
# HIGHER order = architecturally LOWER (foundation, bottom of stack).
# A file in a lower-order layer may import from higher-order layers;
# reverse edges (higher-order → lower-order) violate the hierarchy.
#
# Within each package we reserve a band of order numbers so cross-package
# and within-package rules can coexist without collisions.
#
# Paths are relative to the repo root. Keep layer paths directory/glob-based;
# do not add exact file-name carve-outs.

[constraints]
# sentrux 0.5.7 reports 1 "cycle": a single strongly-connected component of
# 121 files spanning examples/openui-airbnb, packages/core, packages/context,
# packages/openui, and packages/types. That is the whole barrel-exporting
# graph collapsed into one component, not a real cycle — an independent
# file-level SCC pass over the same import graph finds none, and the DSM
# shows clean layering. (The component's membership has changed as packages
# moved — it previously named code-agent/lsp ↔ tools/node-factory — but the
# artifact is the same.) Accept 1 until upstream SCC detection is fixed;
# a genuinely new cycle still fails, since any value above this ceiling does.
max_cycles = 1
max_coupling = "B"
# Pre-existing on `main` before this refactor — `main`'s `sentrux check`
# has been failing this rule at cc=29 (see the `createLocalSubprocessAdapter`
# function in what is now `packages/platform-node/src/local-subprocess-adapter.ts`,
# unchanged across the move). Raising to 29 acknowledges the debt
# rather than hiding it; the function is on the list for a follow-up
# refactor that extracts the dispatch table.
max_cc = 29
no_god_files = true

# ─────────────────────────────────────────────────────────────────────────────
# Tier A — top-level consumers
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "plugins"
paths = ["packages/plugin-*/src/**"]
order = 0

[[layers]]
name = "web"
paths = ["packages/web/**"]
order = 0

[[layers]]
name = "inspector"
paths = ["packages/inspector/**"]
order = 0

# ─────────────────────────────────────────────────────────────────────────────
# Tier B — CLI-internal layers (packages/cli/src/**)
# See specs/22-cli-architecture.md.
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "cli-entry"
paths = ["packages/cli/src/cli/**"]
order = 10

[[layers]]
name = "cli-presentation"
paths = ["packages/cli/src/tui/**"]
order = 11

[[layers]]
name = "cli-orchestration"
paths = [
  "packages/cli/src/harness/**",
  "packages/cli/src/sessions/**",
  "packages/cli/src/plan/**",
  "packages/cli/src/daemon-runtime/**",
]
order = 12

[[layers]]
name = "cli-domain"
paths = [
  "packages/cli/src/tools/**",
  "packages/cli/src/agents/**",
  "packages/cli/src/skills/**",
  "packages/cli/src/plugins/**",
  "packages/cli/src/commands/**",
  "packages/cli/src/tasks/**",
]
order = 13

[[layers]]
name = "cli-infra"
paths = [
  "packages/cli/src/adapters/**",
  "packages/cli/src/ai/**",
  "packages/cli/src/lsp/**",
  "packages/cli/src/config/**",
  "packages/cli/src/setup/**",
]
order = 14

[[layers]]
name = "cli-foundations"
paths = [
  "packages/cli/src/types/**",
  "packages/cli/src/errors/**",
  "packages/cli/src/util/**",
]
order = 15

# ─────────────────────────────────────────────────────────────────────────────
# Tier C — peer packages that depend only on @noetic-tools/core
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "code-agent"
paths = ["packages/code-agent/src/**"]
order = 50

[[layers]]
name = "eval"
paths = ["packages/eval/src/**"]
order = 50

[[layers]]
name = "platform-node"
paths = ["packages/platform-node/src/**"]
order = 50

[[layers]]
name = "platform-browser"
paths = ["packages/platform-browser/src/**"]
order = 50

# ─────────────────────────────────────────────────────────────────────────────
# Tier D — core-internal layers (packages/core/src/**)
# Ordered per the dependency graph in specs/00-overview.md: harness →
# adapters → interpreter → runtime → primitives →
# context/observability → foundations.
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "core-harness"
paths = ["packages/core/src/harness/**"]
order = 79

[[layers]]
name = "core-adapters"
paths = ["packages/core/src/adapters/**"]
order = 81

[[layers]]
name = "core-interpreter"
paths = ["packages/core/src/interpreter/**"]
order = 82

[[layers]]
name = "core-runtime"
paths = ["packages/core/src/runtime/**"]
order = 83

[[layers]]
name = "core-primitives"
paths = [
  "packages/core/src/builders/**",
  "packages/core/src/conditions/**",
  "packages/core/src/until/**",
]
order = 84

[[layers]]
name = "core-observability"
paths = ["packages/core/src/observability/**"]
order = 85

[[layers]]
name = "core-foundations"
paths = [
  "packages/core/src/types/**",
  "packages/core/src/errors/**",
  "packages/core/src/schemas/**",
  "packages/core/src/util/**",
]
order = 86

# ─────────────────────────────────────────────────────────────────────────────
# Tier E — foundational shared packages. The context layer system and the
# type/contract vocabulary it builds on were extracted from core so they can
# ship as standalone npm packages (@noetic-tools/context, @noetic-tools/types).
# They sit BELOW every core layer: core imports them, never the reverse.
# @noetic-tools/types is the dependency-free bottom; @noetic-tools/context
# builds on types and is consumed by core.
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "noetic-context"
paths = ["packages/context/src/**"]
order = 88

[[layers]]
name = "noetic-types"
paths = ["packages/types/src/**"]
order = 90

# ─────────────────────────────────────────────────────────────────────────────
# Foundation acyclicity + context tree-shakability. @noetic-tools/context and
# @noetic-tools/types are extracted foundational packages: core depends on
# them, never the reverse. A context layer importing back into core would
# both create a package cycle and defeat tree-shakability (importing one
# layer must not pull in the interpreter/runtime). @noetic-tools/types is
# the dependency-free bottom of the stack.
# ─────────────────────────────────────────────────────────────────────────────

[[boundaries]]
from = "packages/context/src/**"
to = "packages/core/src/**"
reason = "core depends on @noetic-tools/context; context must never import back into core (acyclic) and must stay tree-shakable from the interpreter/runtime"

[[boundaries]]
from = "packages/types/src/**"
to = "packages/context/src/**"
reason = "@noetic-tools/types is the dependency-free foundation; @noetic-tools/context builds on it, not the reverse"

[[boundaries]]
from = "packages/types/src/**"
to = "packages/core/src/**"
reason = "@noetic-tools/types is the dependency-free foundation; core builds on it, not the reverse"

# ─────────────────────────────────────────────────────────────────────────────
# Peer-package isolation at tier 50 — code-agent and eval are
# siblings that depend only on @noetic-tools/core; they must not reach across.
# Same-order layers are otherwise unconstrained, so these have to be
# explicit.
# ─────────────────────────────────────────────────────────────────────────────

[[boundaries]]
from = "packages/eval/src/**"
to = "packages/code-agent/src/**"
reason = "eval is a peer of code-agent; both depend only on @noetic-tools/core"

[[boundaries]]
from = "packages/eval/src/**"
to = "packages/cli/src/**"
reason = "eval must not depend on cli"

[[boundaries]]
from = "packages/code-agent/src/**"
to = "packages/eval/src/**"
reason = "code-agent must not depend on eval"

# ─────────────────────────────────────────────────────────────────────────────
# Platform packages: runtime-isolated, peer-isolated, and core is forbidden
# from reaching into either. The invariant is that @noetic-tools/core carries no
# runtime-specific code — only contracts + in-memory adapters — and that the
# two platform packages never see each other so bundlers can drop one
# entirely from a target's output.
# ─────────────────────────────────────────────────────────────────────────────

[[boundaries]]
from = "packages/platform-node/src/**"
to = "packages/platform-browser/src/**"
reason = "platform packages must stay runtime-isolated; neither may import from the other"

[[boundaries]]
from = "packages/platform-browser/src/**"
to = "packages/platform-node/src/**"
reason = "platform packages must stay runtime-isolated; neither may import from the other"

[[boundaries]]
from = "packages/core/src/**"
to = "packages/platform-node/src/**"
reason = "core is runtime-agnostic; it cannot depend on a specific platform"

[[boundaries]]
from = "packages/core/src/**"
to = "packages/platform-browser/src/**"
reason = "core is runtime-agnostic; it cannot depend on a specific platform"

[[boundaries]]
from = "packages/context/src/**"
to = "packages/platform-node/src/**"
reason = "context layers are platform-independent; platform packages are platform-specific"

[[boundaries]]
from = "packages/context/src/**"
to = "packages/platform-browser/src/**"
reason = "context layers are platform-independent; platform packages are platform-specific"

[[boundaries]]
from = "packages/platform-node/src/**"
to = "packages/code-agent/src/**"
reason = "platform-node is a peer of code-agent; both depend only on @noetic-tools/core"

[[boundaries]]
from = "packages/platform-node/src/**"
to = "packages/eval/src/**"
reason = "platform-node is a peer of eval; both depend only on @noetic-tools/core"

[[boundaries]]
from = "packages/platform-node/src/**"
to = "packages/cli/src/**"
reason = "platform-node must not depend on cli"

[[boundaries]]
from = "packages/platform-browser/src/**"
to = "packages/code-agent/src/**"
reason = "platform-browser is a peer of code-agent; both depend only on @noetic-tools/core"

[[boundaries]]
from = "packages/platform-browser/src/**"
to = "packages/eval/src/**"
reason = "platform-browser is a peer of eval; both depend only on @noetic-tools/core"

[[boundaries]]
from = "packages/platform-browser/src/**"
to = "packages/cli/src/**"
reason = "platform-browser must not depend on cli"

# Reverse direction: Node-only consumers must not reach into the
# browser platform package. Nothing in cli/code-agent/eval
# should accidentally pull browser-only exports — the import itself
# would be harmless today (platform-browser re-exports in-memory
# adapters), but bundlers targeting Node shouldn't follow this edge
# and the rule lets us add browser-specific code later without a
# migration.

[[boundaries]]
from = "packages/cli/src/**"
to = "packages/platform-browser/src/**"
reason = "cli is Node-only; must not reach into the browser platform package"

[[boundaries]]
from = "packages/code-agent/src/**"
to = "packages/platform-browser/src/**"
reason = "code-agent is Node-only; must not reach into the browser platform package"

[[boundaries]]
from = "packages/eval/src/**"
to = "packages/platform-browser/src/**"
reason = "eval is runtime-agnostic via adapter injection; a direct browser-platform import would pin its runtime"

# ─────────────────────────────────────────────────────────────────────────────
# Docs-site isolation (@noetic/web) is enforced via packages/web/package.json
# workspace deps, NOT via rules.toml — the .typecheck-snippets-shims/ dir has
# a legitimate type-only import of @noetic-tools/core for MDX snippet typechecking
# that any file-path-level boundary would flag as a false positive.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Tier F — @noetic-tools/acp, the Agent Client Protocol client. It depends only
# on @noetic-tools/types and owns the protocol library, the client-side fs/
# terminal/permission handlers, and the agent presets. core resolves ACP agents
# through the @noetic-tools/types contract + a runtime registry, so it must
# NEVER import this package — no protocol library or agent SDK enters core's
# dependency graph. Because every ACP agent is a uniform JSON-RPC peer, the five
# per-vendor adapter packages this replaces (and their sibling-isolation
# boundaries) are gone: there is nothing vendor-specific left to isolate.
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "acp"
paths = ["packages/acp/src/**"]
order = 87

# @noetic-tools/openui builds on @noetic-tools/context + @noetic-tools/types (the
# openUiSurface context layer + the OutputCodec/UiFragment contracts) and is a
# consumer package like the ACP client — it sits above context/types and below
# every core layer. core sees only the dialect-agnostic contracts in types; it
# must never import openui or pull the OpenUI parser/transport into its
# dependency graph (see specs/28-generative-ui.md).
[[layers]]
name = "openui"
paths = ["packages/openui/src/**"]
order = 87

[[boundaries]]
from = "packages/core/src/**"
to = "packages/openui/src/**"
reason = "core resolves generative-UI output via the @noetic-tools/types OutputCodec/UiFragment contracts; it must never import @noetic-tools/openui or pull the OpenUI Lang parser/surface/transport into its dependency graph"

[[boundaries]]
from = "packages/context/src/**"
to = "packages/openui/src/**"
reason = "@noetic-tools/openui depends on @noetic-tools/context (the openUiSurface layer builds on it); context must never import back into openui (acyclic + tree-shakable)"

[[boundaries]]
from = "packages/core/src/**"
to = "packages/acp/src/**"
reason = "core resolves ACP agents via the @noetic-tools/types contract + a runtime registry; it must never import @noetic-tools/acp, so no protocol code is loaded at runtime by core (this rule checks source imports; the npm dependency tree still contains the protocol package via @noetic-tools/types)"

[[boundaries]]
from = "packages/acp/src/**"
to = "packages/core/src/**"
reason = "@noetic-tools/acp depends only on @noetic-tools/types; it must never import core (acyclic, keeps the protocol layer core-free)"

[[layers]]
name = "chat-sdk"
paths = ["packages/chat-sdk/src/**"]
order = 50

[[boundaries]]
from = "packages/core/src/**"
to = "packages/chat-sdk/src/**"
reason = "core must never depend on a chat platform integration; the integration receives the harness by contract, never the reverse"

[[boundaries]]
from = "packages/chat-sdk/src/**"
to = "packages/core/src/**"
reason = "@noetic-tools/chat-sdk depends only on @noetic-tools/types; it drives any harness through AgentHarnessContract, so core must stay out of its dependency graph"

[[boundaries]]
from = "packages/chat-sdk/src/**"
to = "packages/platform-node/src/**"
reason = "chat-sdk is runtime-agnostic (it runs wherever chat-sdk.dev runs, including serverless); it must not pin itself to a platform package"

[[boundaries]]
from = "packages/chat-sdk/src/**"
to = "packages/platform-browser/src/**"
reason = "chat-sdk is runtime-agnostic; it must not pin itself to a platform package"

[[boundaries]]
from = "packages/chat-sdk/src/**"
to = "packages/cli/src/**"
reason = "chat-sdk must not depend on cli"

# ─────────────────────────────────────────────────────────────────────────────
# @noetic-tools/agent-plugins — the Agent Plugins v1 client (agent-plugins.org).
# It ships the agentPlugins() context layer and, like the ACP client and openui,
# is a consumer package sitting above types and below every core layer. It is
# the only package allowed to depend on the MCP SDK, and it launches plugin
# subprocesses; core must never import it, for the same reason it must never
# import the ACP client — no protocol library, vendor SDK, or subprocess
# launcher enters core's dependency graph. See specs/30-agent-plugins.md.
# ─────────────────────────────────────────────────────────────────────────────

[[layers]]
name = "agent-plugins"
paths = ["packages/agent-plugins/src/**"]
order = 87

[[boundaries]]
from = "packages/core/src/**"
to = "packages/agent-plugins/src/**"
reason = "core must never import @noetic-tools/agent-plugins or pull the MCP SDK and its stdio subprocess launcher into its dependency graph; hosts compose the agentPlugins() layer in, the same way they compose the ACP client"

[[boundaries]]
from = "packages/agent-plugins/src/**"
to = "packages/core/src/**"
reason = "@noetic-tools/agent-plugins builds on the @noetic-tools/types ContextLayer contract; it must never import back into core (acyclic)"

[[boundaries]]
from = "packages/agent-plugins/src/**"
to = "packages/context/src/**"
reason = "@noetic-tools/agent-plugins depends only on @noetic-tools/types; keeping it off @noetic-tools/context means composing the layer never drags the other built-in layers in"

[[boundaries]]
from = "packages/context/src/**"
to = "packages/agent-plugins/src/**"
reason = "@noetic-tools/context is the foundational layer package; it must not reach up into a consumer package that carries the MCP SDK"
