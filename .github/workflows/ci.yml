name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Install Bun from the official release archive. Pinned version for a
      # deterministic toolchain, and arch-aware (x64/aarch64) so the same step
      # runs on GitHub's x64 runners and arm64 containers (e.g. local-ci on
      # Apple Silicon). Replaces oven-sh/setup-bun@v2, whose version resolution
      # calls api.github.com with the job token — unavailable in sandboxed
      # runners — and whose action cache is not portable.
      - name: Set up Bun
        env:
          BUN_VERSION: 1.3.14
        run: |
          case "$(uname -m)" in
            x86_64) BUN_ASSET="bun-linux-x64" ;;
            aarch64) BUN_ASSET="bun-linux-aarch64" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/${BUN_ASSET}.zip" -o /tmp/bun.zip
          unzip -oq /tmp/bun.zip -d /tmp/bun-extract
          BUN_BIN="$(find /tmp/bun-extract -type f -name bun | head -1)"
          sudo install -m 0755 "$BUN_BIN" /usr/local/bin/bun
          sudo ln -sf /usr/local/bin/bun /usr/local/bin/bunx
          bun --version

      - name: Install dependencies
        run: bun install

      # Build the foundational dists in dependency order. Consumers (eval,
      # docs, the test suites) resolve `@noetic-tools/core` via its built
      # `dist/*.d.ts`/`*.js`, and core's own build resolves @noetic-tools/types
      # and @noetic-tools/context via their dists. Without this, tsc/bun can't
      # find the packages and the typecheck/test steps fail.
      - name: Build packages
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/context build
          bun run --cwd packages/core build

      - name: Lint
        run: bunx biome check .

      # NOTE: use `bun run --cwd <path> <script>`, NOT `bun --cwd <path> run <script>`.
      # The latter form no-ops on Bun >=1.3 (prints help, exits 0) — a false green.
      # Dists are already built up front by the "Build packages" step above, in
      # dependency order (types → context → core), so downstream typechecks/tests
      # resolve cross-package imports via the emitted dist.
      - name: Typecheck types
        run: bun run --cwd packages/types typecheck

      - name: Typecheck context
        run: bun run --cwd packages/context typecheck

      - name: Typecheck core
        run: bun run --cwd packages/core typecheck

      - name: Typecheck eval
        run: bun run --cwd packages/eval typecheck

      - name: Typecheck inspector
        run: bun run --cwd packages/inspector typecheck

      - name: Typecheck root examples
        run: bun run typecheck:examples

      - name: Check export tags
        run: bun run check:exports

      - name: Check docs (Kiira)
        run: bun run --cwd packages/web check:docs

      - name: Test types
        run: bun run --cwd packages/types test:ci

      - name: Test context
        run: bun run --cwd packages/context test:ci

      - name: Test core
        run: bun run --cwd packages/core test:ci

      - name: Test eval
        run: bun run --cwd packages/eval test:ci

      - name: Test inspector
        run: bun run --cwd packages/inspector test:ci

      - name: Build web
        run: bun run --cwd packages/web test:build

      - name: Install lychee
        run: |
          case "$(uname -m)" in
            x86_64) LYCHEE_ASSET="lychee-x86_64-unknown-linux-gnu.tar.gz" ;;
            aarch64) LYCHEE_ASSET="lychee-aarch64-unknown-linux-gnu.tar.gz" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/${LYCHEE_ASSET}" \
            | tar xz --strip-components=1 "${LYCHEE_ASSET%.tar.gz}/lychee"
          sudo install -m 0755 lychee /usr/local/bin/lychee
          lychee --version

      - name: Link check
        run: bun run --cwd packages/web test:links

      # `noetic test --check` exits 1 on failing cases, regressions, or
      # baseline cases missing from the run; main is a hard gate, PRs warn.
      - name: Eval regression (if baselines exist)
        if: hashFiles('.noetic/baselines/**') != ''
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            bun run --cwd packages/eval src/cli/cli.ts test --check
          else
            bun run --cwd packages/eval src/cli/cli.ts test --check || echo "::warning::Eval regression detected — scores degraded on this PR"
          fi

  structural-gate:
    name: Structural gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install sentrux
        env:
          SENTRUX_VERSION: v0.5.7
        run: |
          case "$(uname -m)" in
            x86_64) SENTRUX_ASSET="sentrux-linux-x86_64" ;;
            aarch64) SENTRUX_ASSET="sentrux-linux-aarch64" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          # The aarch64 build links GTK; the x86_64 build does not. GitHub's
          # runners ship GTK already, so only arm64 containers need this.
          if [ "$(uname -m)" = "aarch64" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libgtk-3-0t64
          fi
          curl -fsSL \
            "https://github.com/sentrux/sentrux/releases/download/${SENTRUX_VERSION}/${SENTRUX_ASSET}" \
            -o /tmp/sentrux
          sudo install -m 0755 /tmp/sentrux /usr/local/bin/sentrux
          sentrux --version

      - name: Structural regression gate
        run: sentrux gate .
