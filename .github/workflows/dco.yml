name: DCO

# Verifies that every commit in a pull request carries a valid
# `Signed-off-by` line (Developer Certificate of Origin). Uses the safe
# `pull_request` trigger — runs with a read-only token and no secrets, so it is
# safe for fork-based contributions and is inherited by forks with no setup.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco-check:
    name: Check Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR commits
        uses: actions/checkout@v4
        with:
          # Fetch base + head so we can enumerate exactly the PR's commits.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify DCO sign-off on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "Checking commits in ${BASE_SHA}..${HEAD_SHA}"
          commits=$(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ -z "${commits}" ]; then
            echo "No commits to check."
            exit 0
          fi

          failed=0
          while read -r sha; do
            [ -z "${sha}" ] && continue

            author_name=$(git show -s --format='%an' "${sha}")
            author_email=$(git show -s --format='%ae' "${sha}")
            subject=$(git show -s --format='%s' "${sha}")
            body=$(git show -s --format='%B' "${sha}")

            # Merge commits created by GitHub don't need a sign-off.
            parents=$(git show -s --format='%P' "${sha}")
            if [ "$(echo "${parents}" | wc -w)" -gt 1 ]; then
              echo "skip  ${sha:0:8} (merge commit) — ${subject}"
              continue
            fi

            expected="Signed-off-by: ${author_name} <${author_email}>"
            if echo "${body}" | grep -qxF "${expected}"; then
              echo "ok    ${sha:0:8} — ${subject}"
            else
              echo "FAIL  ${sha:0:8} — ${subject}"
              echo "      missing or mismatched sign-off."
              echo "      expected: ${expected}"
              failed=1
            fi
          done <<< "${commits}"

          if [ "${failed}" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a valid 'Signed-off-by' line."
            echo "Sign off your commits with 'git commit -s'. To fix existing commits:"
            echo "  git rebase --signoff ${BASE_SHA}"
            echo "  git push --force-with-lease"
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi

          echo ""
          echo "All commits are signed off. ✔"
