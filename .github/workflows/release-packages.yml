name: Release packages

# Each release pushes a version commit, so jobs run in dependency order
# and check out the latest commit of the branch that was pushed. `main`
# publishes to the `latest` dist-tag; `next` publishes prereleases
# (`x.y.z-next.N`) to the `next` dist-tag.

on:
  push:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  types:
    name: Release @noetic-tools/types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Check out the BRANCH, not github.sha: a preceding job in this run
      # may have pushed a `chore: release` commit, and semantic-release
      # refuses to run from a stale checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Check release coverage
        run: bun test scripts/release.test.ts

      - name: Lint
        run: bunx biome check packages/types

      - name: Typecheck
        run: bun run --cwd packages/types typecheck

      - name: Build
        run: bun run --cwd packages/types build

      # semantic-release runs `npm version`, which builds the full workspace tree
      # and chokes on sibling packages' `workspace:*` deps (EUNSUPPORTEDPROTOCOL).
      # Drop the root `workspaces` field so npm treats the package as standalone.
      # The runner is ephemeral and this file is never committed back.
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/types

      - name: Release
        working-directory: packages/types
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  context:
    name: Release @noetic-tools/context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: types
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/context

      - name: Typecheck
        run: bun run --cwd packages/context typecheck

      # @noetic-tools/context depends on @noetic-tools/types. Build the dependency's
      # dist first so context's own build (run by `prepublishOnly`) and the Node
      # ESM smoke test can resolve `@noetic-tools/types` via node_modules.
      - name: Build dependency (@noetic-tools/types)
        run: bun run --cwd packages/types build

      - name: Build
        run: bun run --cwd packages/context build

      # See the types job. context's own `workspace:*` deps are pinned to concrete
      # versions at publish time by `prepublishOnly` (scripts/pin-workspace-deps.ts).
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/context

      - name: Release
        working-directory: packages/context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo


  acp:
    name: Release @noetic-tools/acp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: context
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/acp

      - name: Typecheck
        run: bun run --cwd packages/acp typecheck

      # @noetic-tools/acp depends on @noetic-tools/types. Build the dependency's
      # dist first so acp's own build (run by `prepublishOnly`) and the Node ESM
      # smoke test can resolve `@noetic-tools/types` via node_modules.
      - name: Build dependency (@noetic-tools/types)
        run: bun run --cwd packages/types build

      - name: Build
        run: bun run --cwd packages/acp build

      # See the types job. acp's own `workspace:*` deps are pinned to concrete
      # versions at publish time by `prepublishOnly`
      # (scripts/pin-workspace-deps.ts).
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/acp

      - name: Release
        working-directory: packages/acp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo


  core:
    name: Release @noetic-tools/core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: acp
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/core

      - name: Typecheck
        run: bun run --cwd packages/core typecheck

      # @noetic-tools/core depends on @noetic-tools/types and @noetic-tools/context.
      # Build those dists first so core's own build (run by `prepublishOnly`) and
      # the Node ESM smoke test can resolve them via node_modules.
      - name: Build dependencies (@noetic-tools/types, @noetic-tools/context)
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/context build

      - name: Build
        run: bun run --cwd packages/core build

      # See the types job. core's own `workspace:*` deps (@noetic-tools/types,
      # @noetic-tools/context) are pinned to concrete versions at publish time by
      # `prepublishOnly` (scripts/pin-workspace-deps.ts).
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/core

      - name: Release
        working-directory: packages/core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  # openui depends on context + types (never on core), so it can release after the
  # rest of the chain — its pinned deps are already on npm by then. core never
  # imports openui, so the reverse edge doesn't exist.
  openui:
    name: Release @noetic-tools/openui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: core
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/openui

      - name: Typecheck
        run: bun run --cwd packages/openui typecheck

      # @noetic-tools/openui depends on @noetic-tools/types and @noetic-tools/context.
      # Build those dists first so openui's own build (run by `prepublishOnly`) and
      # the Node ESM smoke test can resolve them via node_modules.
      - name: Build dependencies (@noetic-tools/types, @noetic-tools/context)
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/context build

      - name: Build
        run: bun run --cwd packages/openui build

      # See the types job. openui's own `workspace:*` deps are pinned to concrete
      # versions at publish time by `prepublishOnly` (scripts/pin-workspace-deps.ts).
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/openui

      - name: Release
        working-directory: packages/openui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  # @noetic-tools/agent-plugins depends only on @noetic-tools/types, so it could
  # release right after types. It is sequenced here instead because every job in
  # this workflow pushes a `chore: release` commit to main, and running them in
  # one chain is what keeps a sibling from being stranded behind a moved ref.
  agent-plugins:
    name: Release @noetic-tools/agent-plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: openui
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/agent-plugins

      - name: Typecheck
        run: bun run --cwd packages/agent-plugins typecheck

      - name: Test
        run: bun run --cwd packages/agent-plugins test

      # Only @noetic-tools/types is needed: the package builds on the
      # ContextLayer contract and nothing else in the workspace.
      - name: Build dependency (@noetic-tools/types)
        run: bun run --cwd packages/types build

      - name: Build
        run: bun run --cwd packages/agent-plugins build

      # See the types job. `workspace:*` deps are pinned to concrete versions at
      # publish time by `prepublishOnly` (scripts/pin-workspace-deps.ts).
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/agent-plugins

      - name: Release
        working-directory: packages/agent-plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  eval:
    name: Release @noetic-tools/eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: agent-plugins
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/eval

      - name: Typecheck
        run: bun run --cwd packages/eval typecheck

      # @noetic-tools/eval depends on @noetic-tools/core. Build the core chain's dists
      # first so eval's own build (run by `prepublishOnly`) and the Node ESM smoke
      # test can resolve them via node_modules — tsconfig.build.json drops the
      # `bun` condition, so src/*.ts is not resolvable at build time.
      - name: Build dependencies (@noetic-tools/types, @noetic-tools/context, @noetic-tools/core)
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/context build
          bun run --cwd packages/core build

      - name: Build
        run: bun run --cwd packages/eval build

      # See the types job. eval's own `workspace:*` dep (@noetic-tools/core) is
      # pinned to a concrete version at publish time by `prepublishOnly`
      # (scripts/pin-workspace-deps.ts).
      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/eval

      - name: Release
        working-directory: packages/eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  # npm requires a first token-based publish before these packages can add a
  # trusted publisher. OIDC takes priority once the trust settings exist.
  chat-sdk:
    name: Release @noetic-tools/chat-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: eval
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/chat-sdk

      - name: Typecheck
        run: bun run --cwd packages/chat-sdk typecheck

      - name: Test
        run: bun run --cwd packages/chat-sdk test

      - name: Build dependencies
        run: |
          bun run --cwd packages/types build

      - name: Build
        run: bun run --cwd packages/chat-sdk build

      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/chat-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        working-directory: packages/chat-sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  platform-node:
    name: Release @noetic-tools/platform-node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: chat-sdk
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/platform-node

      - name: Typecheck
        run: bun run --cwd packages/platform-node typecheck

      - name: Test
        run: bun run --cwd packages/platform-node test

      - name: Build dependencies
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/context build
          bun run --cwd packages/core build

      - name: Build
        run: bun run --cwd packages/platform-node build

      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/platform-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        working-directory: packages/platform-node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo

  platform-browser:
    name: Release @noetic/platform-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: platform-node
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx biome check packages/platform-browser

      - name: Typecheck
        run: bun run --cwd packages/platform-browser typecheck

      - name: Build dependencies
        run: |
          bun run --cwd packages/types build
          bun run --cwd packages/context build
          bun run --cwd packages/core build

      - name: Build
        run: bun run --cwd packages/platform-browser build

      - name: Detach package from workspace for npm
        run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Finish any pending npm publish
        run: bash scripts/publish-missing.sh packages/platform-browser
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release
        working-directory: packages/platform-browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx --yes -p semantic-release@25 -p semantic-release-monorepo@8 -p @semantic-release/changelog@6 -p @semantic-release/git@10 -p conventional-changelog-conventionalcommits@7 semantic-release --extends semantic-release-monorepo
